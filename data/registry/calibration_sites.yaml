# Калибровочный реестр сайтов
#
# Эталонные значения проверены вручную 2026-07-28 по указанным URL.
# Используется в тестах person_extractor и для расчёта precision в QA.

institutions:
  - name: "ГБУЗ ВО «Областной перинатальный центр»"
    city: Владимир
    site: "https://opc33.ru"
    leadership_url: "https://opc33.ru/kontakty/"
    expected_chief: "Денисова Наталья Михайловна"
    note: "на странице есть ловушка — «Приемная главного врача ... Секретари Александрова И.С.»"

  - name: "ГБУ «Перинатальный центр» Ростовской области"
    city: Ростов-на-Дону
    site: "https://perinatal-rostov.ru"
    leadership_url: "https://perinatal-rostov.ru/kontaktyi.html"
    expected_chief: "Уманский Максим Николаевич"
    note: "список отделений с заведующими — источник pathology_head"

  - name: "ГБУЗ «Областной перинатальный центр» (Челябинск)"
    city: Челябинск
    site: "https://opc74.ru"
    leadership_url: "https://opc74.ru/index.php/contact"
    expected_chief: "Воропаева Екатерина Евгеньевна"
    note: "таблица, роль и ФИО в одном tr"

  - name: "Республиканский клинический перинатальный центр (Уфа)"
    city: Уфа
    site: "https://rkpcufa.ru"
    leadership_url: "https://rkpcufa.ru/about/glavnyy-vrach.php"
    expected_chief: "Савина Лиана Венеровна"
    note: "формат «Главный врач - ФИО» в одном абзаце"

  - name: "Перинатальный центр (Сочи)"
    city: Сочи
    site: "https://comid-sochi.ru"
    leadership_url: "https://comid-sochi.ru/contact"
    expected_chief: "Аргунов Андрей Васильевич"
    note: "и.о. главного врача"

  - name: "КОГБУЗ «Кировский областной клинический перинатальный центр»"
    city: Киров
    site: "https://pncenter.ru"
    leadership_url: "https://pncenter.ru/контакты/tel_numbers"
    expected_chief: "Семеновский Николай Владимирович"
    note: "ФИО только в телефонном справочнике, не на /о-нас — проверяет обход в 2 уровня"

# Домены, недоступные при разведке (нужны ретраи / http fallback)
unreachable:
  - "https://ncagp.ru"          # read timeout
  - "https://guzpc.ru"          # timeout
  - "https://www.klinika16.ru"  # timeout
  - "http://perc.medportal.saratov.gov.ru/"  # connection refused

# Домены со страницами руководства, но без ФИО в тексте (картинка/PDF)
manual_required:
  - "https://pkkb.perm.ru/glavnyy-vrach"
